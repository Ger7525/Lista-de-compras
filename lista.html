<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geralista - Lista de Compras</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header style="flex-direction: row; justify-content: center;">
    <img src="img/geralista-removebg-preview.png" alt="Geralista Logo" class="header-logo" style="max-width: 180px;">
    <button class="theme-toggle-btn" id="theme-toggle" style="top: auto;">
      <span id="theme-icon">☀️</span> <span id="theme-text">Modo Claro</span>
    </button>
  </header>

  <main style="max-width: 850px;">
    <div class="actions-bar">
      <a href="index.html" class="btn btn-outline" style="width: auto;">← Voltar ao Cadastro</a>
      <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
        <button id="btn-whatsapp" class="btn btn-whatsapp" style="width: auto;">📱 Enviar p/ WhatsApp</button>
        <button id="btn-clear" class="btn btn-danger" style="width: auto;">Encerrar Lista</button>
      </div>
    </div>

    <div class="progress-card">
      <div class="progress-header">
        <span>Progresso das Compras</span>
        <span id="progress-text">0% concluído</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
      </div>
    </div>

    <div id="sectors-container" class="grid-container"></div>
  </main>

  <footer>
    <img src="img/gs_interictive-molde-removebg-preview.png" alt="GS Interactive Footer Banner" class="footer-card-img">
  </footer>

  <script src="js/app.js"></script>
  <script src="js/lista.html.js"></script>
</body>
</html>
