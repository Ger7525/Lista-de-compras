<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Compras de Mariana - Mercadinho</title>
  <style>
    :root {
      --primary-green: #2e7d32;
      --green-hover: #1b5e20;
      --accent-blue: #0288d1;
      --blue-hover: #01579b;
      --bg-white: #f8fafc;
      --card-bg: #ffffff;
      --text-dark: #1e293b;
      --muted: #64748b;
      --danger: #d32f2f;
      --danger-hover: #9a0007;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-white);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, var(--primary-green), var(--accent-blue));
      color: white;
      text-align: center;
      padding: 1.5rem 1rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    main {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 1.5rem auto;
      padding: 0 1rem;
    }

    /* Barra Superior de Ações */
    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.65rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s;
    }

    .btn-blue {
      background-color: var(--accent-blue);
      color: white;
    }

    .btn-blue:hover {
      background-color: var(--blue-hover);
    }

    .btn-danger {
      background-color: var(--danger);
      color: white;
    }

    .btn-danger:hover {
      background-color: var(--danger-hover);
    }

    /* Barra de Progresso */
    .progress-card {
      background: var(--card-bg);
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.04);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
      font-weight: 600;
      color: var(--primary-green);
    }

    .progress-bar-bg {
      background-color: #e2e8f0;
      height: 18px;
      border-radius: 9px;
      overflow: hidden;
      width: 100%;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, var(--primary-green), var(--accent-blue));
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Grid de Setores */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .sector-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 1.25rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
    }

    .sector-card h2 {
      font-size: 1.15rem;
      color: var(--accent-blue);
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 0.4rem;
      margin-bottom: 0.75rem;
    }

    .item-list {
      list-style: none;
    }

    .item-list li {
      display: flex;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px dashed #e2e8f0;
    }

    .item-list input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--accent-blue);
      margin-right: 0.75rem;
    }

    .item-text {
      flex: 1;
      font-size: 0.95rem;
    }

    .quantity {
      font-weight: bold;
      color: var(--accent-blue);
      font-size: 0.85rem;
      background: #e0f2fe;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .item-list input[type="checkbox"]:checked + .item-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    footer {
      background-color: #0f172a;
      color: white;
      text-align: center;
      padding: 1.25rem 1rem;
      margin-top: auto;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Lista de compras de Mariana</h1>
  </header>

  <main>
    <div class="actions-bar">
      <a href="index.html" class="btn btn-blue">← Voltar para Cadastro</a>
      <button id="btn-clear" class="btn btn-danger">Encerrar Lista / Limpar Tudo</button>
    </div>

    <!-- Card de Porcentagem e Status -->
    <div class="progress-card">
      <div class="progress-header">
        <span>Progresso das Compras</span>
        <span id="progress-text">0% concluído</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
      </div>
    </div>

    <!-- Conteúdo dividido por categorias -->
    <div id="sectors-container" class="grid-container"></div>
  </main>

  <footer>
    <p>Mariana Valéria todos direitos reservados © <span id="year"></span></p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    let shoppingList = JSON.parse(localStorage.getItem('mariana_shopping_list')) || [];

    const sectorsContainer = document.getElementById('sectors-container');
    const progressBarFill = document.getElementById('progress-bar-fill');
    const progressText = document.getElementById('progress-text');
    const btnClear = document.getElementById('btn-clear');

    function saveData() {
      localStorage.setItem('mariana_shopping_list', JSON.stringify(shoppingList));
    }

    function updateProgress() {
      const total = shoppingList.length;
      const checkedCount = shoppingList.filter(item => item.checked).length;
      const percentage = total === 0 ? 0 : Math.round((checkedCount / total) * 100);

      progressBarFill.style.width = percentage + '%';

      if (total === 0) {
        progressText.textContent = 'Nenhum item cadastrado';
      } else {
        progressText.textContent = `${percentage}% concluído (${checkedCount} de ${total} itens)`;
      }
    }

    function renderShoppingList() {
      sectorsContainer.innerHTML = '';

      if (shoppingList.length === 0) {
        sectorsContainer.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--muted); padding: 2rem;">Nenhum item na lista. Volte ao cadastro para adicionar!</p>';
        updateProgress();
        return;
      }

      // Agrupa os itens por Categoria
      const categories = {};
      shoppingList.forEach(item => {
        if (!categories[item.category]) {
          categories[item.category] = [];
        }
        categories[item.category].push(item);
      });

      // Renderiza um card por Categoria
      Object.keys(categories).forEach(cat => {
        const card = document.createElement('section');
        card.className = 'sector-card';

        let itemsHTML = '';
        categories[cat].forEach(item => {
          itemsHTML += `
            <li>
              <input type="checkbox" id="check-${item.id}" ${item.checked ? 'checked' : ''} onchange="toggleCheck(${item.id})">
              <label for="check-${item.id}" class="item-text">${item.name}</label>
              <span class="quantity">${item.qty}</span>
            </li>
          `;
        });

        card.innerHTML = `
          <h2>${cat}</h2>
          <ul class="item-list">${itemsHTML}</ul>
        `;
        sectorsContainer.appendChild(card);
      });

      updateProgress();
    }

    window.toggleCheck = function(id) {
      const item = shoppingList.find(i => i.id === id);
      if (item) {
        item.checked = !item.checked;
        saveData();
        updateProgress();
      }
    };

    btnClear.addEventListener('click', () => {
      if (confirm('Tem certeza que deseja encerrar a lista? Todos os itens serão apagados.')) {
        shoppingList = [];
        saveData();
        renderShoppingList();
      }
    });

    renderShoppingList();
  </script>
</body>
</html>
