<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geralista - Cadastro de Itens</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <button class="theme-toggle-btn" id="theme-toggle">
      <span id="theme-icon">☀️</span> <span id="theme-text">Modo Claro</span>
    </button>
    <img src="img/geralista-removebg-preview.png" alt="Geralista Logo" class="header-logo">
    <p style="color: var(--text-muted); font-size: 0.85rem;">Lista de Compras Inteligente</p>
  </header>

  <main style="max-width: 650px;">
    <div class="card">
      <h2>Adicionar Item</h2>
      <form id="item-form">
        <div class="form-group">
          <label for="item-name">Nome do Item</label>
          <input type="text" id="item-name" placeholder="Ex: Arroz, Detergente..." required>
        </div>

        <div class="form-group">
          <label for="item-qty">Quantidade</label>
          <input type="text" id="item-qty" placeholder="Ex: 2 kg, 1 pacote" required>
        </div>

        <div class="form-group">
          <label for="item-category">Categoria</label>
          <select id="item-category" required>
            <option value="🍎 Frutas e Hortaliças">🍎 Frutas e Hortaliças</option>
            <option value="🌾 Cereais">🌾 Cereais</option>
            <option value="🧀 Laticínios">🧀 Laticínios</option>
            <option value="🧼 Limpeza e Higiene">🧼 Limpeza e Higiene</option>
            <option value="🥩 Carnes, frangos e peixe">🥩 Carnes, frangos e peixe</option>
          </select>
        </div>

        <button type="submit" class="btn btn-green">Adicionar à Lista</button>
      </form>
    </div>

    <div class="card">
      <h2>Itens na Lista (<span id="items-count">0</span>)</h2>
      <ul id="preview-list" class="preview-list"></ul>
      <div style="margin-top: 1.5rem;">
        <a href="lista.html" class="btn btn-outline">Ir para as Compras →</a>
      </div>
    </div>
  </main>

  <footer>
    <img src="img/gs_interictive-molde-removebg-preview.png" alt="GS Interactive Footer Banner" class="footer-card-img">
  </footer>

  <script src="js/app.js"></script>
  <script src="js/index.html.js"></script>
</body>
</html>
