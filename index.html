<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🦋 Lista da Mary | Cadastro de Itens</title>
  <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <button class="theme-toggle-btn" id="theme-toggle">
      <span id="theme-icon">☀️</span> <span id="theme-text">Modo Claro</span>
    </button>
    <img src="img/Mary-logo-removebg-preview.png" alt="Geralista Logo" class="header-logo">
    <p style="color: var(--text-muted); font-size: 0.85rem;">🛒 LISTA DE COMPRAS INTELIGENTE

Crie sua lista. Do seu jeito.</p>
  </header>

  <main style="max-width: 650px;">
    <div class="card">
      <h2>Itens Prontos</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">Marque os itens que precisa e, se quiser, digite a quantidade.</p>
      <div id="catalog-container"></div>
      <button type="button" id="btn-add-selected" class="btn btn-green" style="margin-top: 1rem;">Adicionar Selecionados</button>
    </div>

    <div class="card">
      <h2>Itens na Lista (<span id="items-count">0</span>)</h2>
      <ul id="preview-list" class="preview-list"></ul>
      <div style="margin-top: 1.5rem;">
        <a href="lista.html" class="btn btn-outline">Ir para as Compras →</a>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; GS Interactive Todos direitos reservados</p>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/index.html.js"></script>
</body>
</html>
