<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Compras de Mariana - Cadastro</title>
  <style>
    :root {
      --primary-green: #2e7d32;
      --green-hover: #1b5e20;
      --accent-blue: #0288d1;
      --blue-hover: #01579b;
      --bg-white: #f8fafc;
      --card-bg: #ffffff;
      --text-dark: #1e293b;
      --muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-white);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, var(--primary-green), var(--accent-blue));
      color: white;
      text-align: center;
      padding: 1.5rem 1rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    main {
      flex: 1;
      max-width: 600px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
      margin-bottom: 1.5rem;
    }

    .card h2 {
      color: var(--primary-green);
      margin-bottom: 1rem;
      border-bottom: 2px solid var(--bg-white);
      padding-bottom: 0.5rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--primary-green);
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(2, 136, 209, 0.2);
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-green {
      background-color: var(--primary-green);
      color: white;
    }

    .btn-green:hover {
      background-color: var(--green-hover);
    }

    .btn-blue {
      background-color: var(--accent-blue);
      color: white;
      text-decoration: none;
      display: block;
      text-align: center;
    }

    .btn-blue:hover {
      background-color: var(--blue-hover);
    }

    .preview-list {
      list-style: none;
      margin-top: 1rem;
    }

    .preview-list li {
      display: flex;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .quantity {
      font-weight: bold;
      color: var(--accent-blue);
      background: #e0f2fe;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.85rem;
    }

    footer {
      background-color: #0f172a;
      color: white;
      text-align: center;
      padding: 1.25rem 1rem;
      margin-top: auto;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Lista de compras de Mariana</h1>
    <p style="font-size: 0.9rem; opacity: 0.9; margin-top: 4px;">Montagem da Lista</p>
  </header>

  <main>
    <!-- Formulário para adicionar itens -->
    <div class="card">
      <h2>Adicionar Novo Item</h2>
      <form id="item-form">
        <div class="form-group">
          <label for="item-name">1. Nome do Item</label>
          <input type="text" id="item-name" placeholder="Ex: Arroz, Sabão, Coxão Mole..." required>
        </div>

        <div class="form-group">
          <label for="item-qty">2. Quantidade</label>
          <input type="text" id="item-qty" placeholder="Ex: 2 kg, 1 pacote, 500g" required>
        </div>

        <div class="form-group">
          <label for="item-category">3. Categoria</label>
          <select id="item-category" required>
            <option value="🌾 Cereais">🌾 Cereais</option>
            <option value="🧀 Laticínios">🧀 Laticínios</option>
            <option value="🧼 Limpeza e Higiene">🧼 Limpeza e Higiene</option>
            <option value="🥩 Carnes, frangos e peixe">🥩 Carnes, frangos e peixe</option>
          </select>
        </div>

        <button type="submit" class="btn btn-green">Adicionar à Lista</button>
      </form>
    </div>

    <!-- Pré-visualização -->
    <div class="card">
      <h2>Itens Cadastrados (<span id="items-count">0</span>)</h2>
      <ul id="preview-list" class="preview-list"></ul>
      <div style="margin-top: 1.5rem;">
        <a href="lista.html" class="btn btn-blue">Ver e Iniciar Compras →</a>
      </div>
    </div>
  </main>

  <footer>
    <p>Mariana Valéria todos direitos reservados © <span id="year"></span></p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    let shoppingList = JSON.parse(localStorage.getItem('mariana_shopping_list')) || [];

    const itemForm = document.getElementById('item-form');
    const previewList = document.getElementById('preview-list');
    const itemsCount = document.getElementById('items-count');

    function saveData() {
      localStorage.setItem('mariana_shopping_list', JSON.stringify(shoppingList));
    }

    function renderPreview() {
      previewList.innerHTML = '';
      itemsCount.textContent = shoppingList.length;

      if (shoppingList.length === 0) {
        previewList.innerHTML = '<li style="color: var(--muted); justify-content: center;">Nenhum item cadastrado ainda.</li>';
        return;
      }

      shoppingList.forEach((item) => {
        const li = document.createElement('li');
        li.innerHTML = `
          <span><strong>${item.name}</strong> <small style="color:var(--muted)">(${item.category})</small></span>
          <span class="quantity">${item.qty}</span>
        `;
        previewList.appendChild(li);
      });
    }

    itemForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('item-name').value.trim();
      const qty = document.getElementById('item-qty').value.trim();
      const category = document.getElementById('item-category').value;

      if (name && qty) {
        shoppingList.push({
          id: Date.now(),
          name,
          qty,
          category,
          checked: false
        });
        saveData();
        itemForm.reset();
        document.getElementById('item-name').focus();
        renderPreview();
      }
    });

    renderPreview();
  </script>
</body>
</html>
